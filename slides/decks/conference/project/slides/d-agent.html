<section id="d-agent" data-transition="fade" style="background:#14171C;color:#ECE8DF;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px"><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#F0A33A">Part 1</p><h1 style="font-size:120px;font-weight:600;line-height:1.1;color:#ECE8DF">What is an agent?</h1><p style="font-size:40px;line-height:1.35;color:#A9B0BC;width:1400px">A system that loops: it observes its inputs, thinks about them, and acts.</p><aside>Before we build one, we need to agree on what an agent is. We'll use a loop you already run yourself.</aside></section>
