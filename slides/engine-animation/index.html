<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Engine Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one scene. A banner across the top shows what's running, the engine (then the car) sits in the middle, the caption and controls dock to the bottom. One dark look by choice. */
:root{
  --bay:#0f141b;
  --bay-2:#19212d;
  --panel:rgba(15,20,27,.9);
  --line:#2b384c;
  --ink:#e8edf5;
  --mute:#a9b5c8;
  --amber:#f2a93b;
  --blue:#5b8cff;
  --cyan:#6fe3ff;
  --green:#5fd38d;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bay);color:var(--ink);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border:1px solid var(--line);padding:10px 14px 12px;pointer-events:none;display:flex;flex-direction:column;gap:8px;transition:opacity .4s}
.banner.off{opacity:0}
.bh{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.bh span{color:var(--mute);letter-spacing:.06em;text-transform:none;font-size:11px}
.loop{display:flex;align-items:center;gap:10px;min-height:28px}
.seq{display:flex;flex-wrap:wrap;gap:3px;align-items:center;flex:1;min-width:0}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 6px;white-space:pre;border:1px solid}
.chip.in{border-color:var(--blue);color:#dbe5ff;background:rgba(91,140,255,.16)}
.chip.out{border-color:var(--amber);color:#ffe4b8;background:rgba(242,169,59,.16)}
.chip.end{border-color:var(--mute);color:var(--mute)}
.new{animation:pop .3s ease both}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.step{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--mute);white-space:nowrap}
.model{padding:3px 8px;border:1px solid var(--line);color:var(--ink);letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.model.on{border-color:var(--amber);background:var(--amber);color:#1b1f26}
.slot{min-width:58px;display:flex}
.prims{display:flex;flex-wrap:wrap;gap:6px}
.prim{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border:1px dashed var(--line);color:var(--mute);transition:all .3s}
.prim b{font-weight:500}
.prim.on{border-style:solid;color:var(--ink)}
.prim.cur{color:#1b1f26}
.prod{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-family:var(--f-mono);font-size:12px;align-items:center}
.prod .c{color:var(--mute)}
.prod .c.on{color:var(--ink)}
.prod .c.cur{color:var(--amber)}
.prod .ps{display:flex;flex-wrap:wrap;gap:4px}
.pp{font-size:11px;padding:1px 6px;border:1px solid;opacity:.4}
.prod .ps.on .pp,.prod .ps.cur .pp{opacity:1}
.prod .lap{color:var(--green);font-size:11px;white-space:nowrap}
.log{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:12px;line-height:1.5}
.log div{white-space:pre-wrap;word-break:break-word}
.log .i{color:#cfdcff}
.log .a{color:#ffe1b0}
.log .r{color:var(--cyan);padding-left:1.4em}
.log .ok{color:var(--green)}
.log .ok.ind{padding-left:1.4em}
.log .s{color:var(--ink)}
.cap{position:fixed;left:0;right:0;bottom:0;padding-top:40px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bay) 58%,rgba(15,20,27,0));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.cap h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.6vw,52px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.cap h1 span{color:var(--amber)}
.cap p{margin:0;max-width:62ch;color:var(--mute);font-size:16px;line-height:1.45}
#notes{max-width:72ch;font-family:var(--f-mono);font-size:12px;line-height:1.55;color:#d5dceb;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);padding:8px 12px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:auto;margin-top:2px}
button{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--bay-2);border:1px solid var(--line);padding:7px 10px;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.count{font-family:var(--f-mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;padding:0 4px}
.hint{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);animation:pulse 2s ease-in-out infinite;margin-left:6px}
.hint.busy{color:var(--mute);animation:none}
@keyframes pulse{50%{opacity:.35}}
.tag{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.04em;padding:4px 8px;white-space:nowrap;opacity:0;transition:opacity .5s;background:var(--ink);color:#1b1f26}
.tag.on{opacity:1}
.tag.ok{background:var(--green);color:#10261a;font-size:14px}
@media (max-width:640px){
  .cap p{font-size:15px}
  .chip{font-size:10px;padding:2px 4px}
  .loop{flex-direction:column;align-items:stretch;gap:6px}
  .bh span{display:none}
  .tag{font-size:10px}
  .prim{font-size:10px;padding:3px 6px}
  .log,.prod{font-size:10px}
  .pp{font-size:9px}
  .hint{display:none}
  #notes{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.hint,.new{animation:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="Tap through: an engine whose output piles up, a car built around it one harness primitive at a time, production upgrades swapped into the same parts, and laps on a test track."></canvas>

<div class="banner off" id="banner"></div>
<div id="tags"></div>

<div class="cap">
  <h1 id="h"></h1>
  <p id="p"></p>
  <div id="notes" hidden></div>
  <div class="nav">
    <button id="back" type="button">Back</button>
    <button id="restart" type="button">Restart</button>
    <button id="ntog" type="button" aria-pressed="false">Notes</button>
    <span class="count" id="count"></span>
    <span class="hint" id="hint"></span>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const REDUCE=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const TAU=Math.PI*2;
const C={graphite:0x3a414d,dark:0x1b1f26,steel:0x8b95a5,metal:0xb3bcc8,amber:0xf2a93b,amberLt:0xffcf7a,copper:0xc8783e,blue:0x5b8cff,
  cobalt:0x2f6fe0,cobaltDk:0x2152b3,cobaltLn:0x1a428f,stripe:0xf1f4f8,glass:0x9fd3f2,sill:0x23272f,head:0xfff1d2,tail:0xff3b30,
  tire:0x17191e,tread:0x22252c,rim:0xc9d0da,seat:0x2a2f3a,cyan:0x6fe3ff,green:0x5fd38d,
  mi:0xf2a93b,in:0x5b8cff,out:0xff7a59,cf:0xb48cff,cx:0x4fd1c5};
const PRIM={mi:{name:"Model interface",css:"#f2a93b",fg:"#1b1f26"},in:{name:"Input",css:"#5b8cff",fg:"#ffffff"},out:{name:"Output",css:"#ff7a59",fg:"#1b1f26"},cf:{name:"Control flow",css:"#b48cff",fg:"#1b1f26"},cx:{name:"Context",css:"#4fd1c5",fg:"#1b1f26"}};

// ================================================================ scene
const canvas=$("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0f141b);scene.fog=new THREE.Fog(0x0f141b,7,18);
const camera=new THREE.PerspectiveCamera(38,1,.02,100);
scene.add(new THREE.HemisphereLight(0xcfdcff,0x1a2230,.55));
const key=new THREE.DirectionalLight(0xfff3e2,1.15);key.position.set(1.5,6,3.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-4.5,right:4.5,top:4.5,bottom:-4.5,near:.5,far:16});key.shadow.bias=-.0004;scene.add(key);key.target.position.set(-1.2,0,0);scene.add(key.target);
const rimL=new THREE.DirectionalLight(0x8fb0ff,.4);rimL.position.set(-3,2,-4);scene.add(rimL);
const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({color:0x222a35,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(20,80,0x2f3b4e,0x27313f);grid.position.y=.002;scene.add(grid);
const OFF=-1.25;
const eng=new THREE.Group();eng.position.x=OFF;scene.add(eng);   // the engine, and the car built around it, share this frame

// ================================================================ voxel modeling helpers
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function sdBox(x,y,z,cx,cy,cz,hx,hy,hz,r){r=r||0;const qx=Math.abs(x-cx)-hx+r,qy=Math.abs(y-cy)-hy+r,qz=Math.abs(z-cz)-hz+r;return Math.hypot(Math.max(qx,0),Math.max(qy,0),Math.max(qz,0))+Math.min(Math.max(qx,qy,qz),0)-r;}
function sdCap(x,y,z,a,b,ra,rb){if(rb===undefined)rb=ra;const bx=b[0]-a[0],by=b[1]-a[1],bz=b[2]-a[2],px=x-a[0],py=y-a[1],pz=z-a[2];const h=Math.max(0,Math.min(1,(px*bx+py*by+pz*bz)/(bx*bx+by*by+bz*bz||1)));return Math.hypot(px-bx*h,py-by*h,pz-bz*h)-(ra+(rb-ra)*h);}
function sdEll(x,y,z,cx,cy,cz,rx,ry,rz){const k0=Math.hypot((x-cx)/rx,(y-cy)/ry,(z-cz)/rz),k1=Math.hypot((x-cx)/(rx*rx),(y-cy)/(ry*ry),(z-cz)/(rz*rz));return k1?k0*(k0-1)/k1:-Math.min(rx,ry,rz);}
function smin(a,b,k){const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;}
function segs(pts,r){const s=[];for(let i=0;i<pts.length-1;i++)s.push([pts[i],pts[i+1],r]);return s;}
function bSegs(list,pad){let b=[1e9,-1e9,1e9,-1e9,1e9,-1e9];list.forEach(t=>[t[0],t[1]].forEach(p=>{const r=t[2]+pad;b[0]=Math.min(b[0],p[0]-r);b[1]=Math.max(b[1],p[0]+r);b[2]=Math.min(b[2],p[1]-r);b[3]=Math.max(b[3],p[1]+r);b[4]=Math.min(b[4],p[2]-r);b[5]=Math.max(b[5],p[2]+r);}));return b;}
function vox(o){const r=o.r,b=o.b,th=o.th||1.1,out=[];
  for(let i=Math.floor(b[0]/r);i<=Math.ceil(b[1]/r);i++)for(let j=Math.floor(b[2]/r);j<=Math.ceil(b[3]/r);j++)for(let k=Math.floor(b[4]/r);k<=Math.ceil(b[5]/r);k++){
    const x=i*r,y=j*r,z=k*r,d=o.d(x,y,z);if(d>r*.5||d<-r*th)continue;const c=o.c?o.c(x,y,z):[o.col,o.kind||0];if(!c)continue;out.push({x,y,z,c:c[0],k:c[1]||0});}
  return out;}
function tubesVox(list,r,c){const map=new Map();list.forEach(t=>{vox({r,b:bSegs([t],r),d:(x,y,z)=>sdCap(x,y,z,t[0],t[1],t[2]),c}).forEach(v=>map.set(Math.round(v.x/r)+","+Math.round(v.y/r)+","+Math.round(v.z/r),v));});return [...map.values()];}
function boxVox(r,cx,cy,cz,hx,hy,hz,c,rad){return vox({r,b:[cx-hx-r,cx+hx+r,cy-hy-r,cy+hy+r,cz-hz-r,cz+hz+r],d:(x,y,z)=>sdBox(x,y,z,cx,cy,cz,hx,hy,hz,rad||0),c});}

// ================================================================ voxel parts that assemble and come apart
const CUBE=new THREE.BoxGeometry(1,1,1),dummy=new THREE.Object3D(),P={},parts=[];
let clock=0,INSTANT=false;
function part(name,r,list,o){
  o=Object.assign({from:"above",spread:1.2,dur:.8},o||{});
  const g=new THREE.Group();if(o.pos)g.position.set(...o.pos);eng.add(g);const col=new THREE.Color(),meshes=[];
  [0,1,2].forEach(kind=>{const L=list.filter(v=>v.k===kind);if(!L.length)return;
    const mat=kind===1?new THREE.MeshBasicMaterial():kind===2?new THREE.MeshStandardMaterial({roughness:.1,metalness:.3,transparent:true,opacity:.45,depthWrite:false}):new THREE.MeshStandardMaterial({roughness:.55,metalness:.15});
    const m=new THREE.InstancedMesh(CUBE,mat,L.length);m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const key=o.from==="below"?(v=>-v.y):o.from==="sides"?(v=>-Math.abs(v.z)):(v=>v.y);
    const order=L.map((v,i)=>i).sort((a,b)=>key(L[a])-key(L[b])+(rnd(a)-rnd(b))*.12);
    order.forEach((i,rank)=>{const v=L[i],r1=rnd(i*3.1+L.length),r2=rnd(i*7.3+name.length),r3=rnd(i*11.7);
      v.d=o.spread*(rank/L.length)*.85+r1*o.spread*.15;
      const sg=Math.sign(o.pos?o.pos[2]:v.z)||1;
      v.o=o.from==="below"?[(r1-.5)*1.2,-.9-r2,(r3-.5)*1.2]:o.from==="sides"?[(r1-.5)*.6,.2+r2*.5,sg*(1.8+r3*1.2)]:o.from==="back"?[-2.2-r1*1.5,.3+r2,(r3-.5)*1.5]:o.from==="pop"?[(r1-.5)*.4,.3+r2*.4,(r3-.5)*.4]:[(r1-.5)*2.4,1.6+r2*1.8,(r3-.5)*2.4];});
    L.forEach((v,i)=>{col.setHex(v.c);m.setColorAt(i,col);});
    m.castShadow=kind!==2;m.receiveShadow=kind===0;m.frustumCulled=false;m.visible=false;m.userData={L,s:r*.94,kind};g.add(m);meshes.push(m);});
  const p={name,g,meshes,o,state:"hidden",t0:0};P[name]=p;parts.push(p);return p;}
function setPart(p,t){const out=p.state==="out";
  p.meshes.forEach(m=>{const {L,s}=m.userData;
    for(let i=0;i<L.length;i++){const v=L[i];let k=out?1-(t-v.d*.5)/.6:(t-v.d)/p.o.dur;
      if(k<=0){dummy.position.set(0,-50,0);dummy.scale.setScalar(1e-4);}
      else{k=Math.min(1,k);const e=1-Math.pow(1-k,3);dummy.position.set(v.x+v.o[0]*(1-e),v.y+v.o[1]*(1-e),v.z+v.o[2]*(1-e));dummy.scale.setScalar(s*(.4+.6*e));}
      dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);}
    m.instanceMatrix.needsUpdate=true;});}
function finish(p){if(p.state==="out"){p.meshes.forEach(m=>m.visible=false);p.state="hidden";}else if(p.state==="in"){setPart(p,1e9);p.state="done";}}
function build(name,delay){const p=P[name];p.meshes.forEach(m=>m.visible=true);p.state="in";p.t0=clock+(delay||0);if(INSTANT||REDUCE)finish(p);else setPart(p,-1);}
function unbuild(name,delay){const p=P[name];if(p.state==="hidden")return;if(p.state==="in")finish(p);p.state="out";p.t0=clock+(delay||0);if(INSTANT||REDUCE)finish(p);}
function swap(a,b,delay){unbuild(a,delay||0);build(b,(delay||0)+.5);}
function animParts(){parts.forEach(p=>{if(p.state!=="in"&&p.state!=="out")return;const t=clock-p.t0;if(t<0&&p.state==="in")return;
  setPart(p,t);const end=p.state==="in"?p.o.spread+p.o.dur+.05:p.o.spread*.5+.65;if(t>end)finish(p);});}

// ================================================================ the engine (the model)
part("stand",.025,(()=>{const S=[[[1.0,.19,-.16],[.92,0,-.32]],[[1.0,.19,.16],[.92,0,.32]],[[1.5,.19,-.16],[1.58,0,-.32]],[[1.5,.19,.16],[1.58,0,.32]],[[.92,0,-.32],[1.58,0,-.32]],[[.92,0,.32],[1.58,0,.32]],[[1.0,.19,-.16],[1.5,.19,-.16]],[[1.0,.19,.16],[1.5,.19,.16]],[[.92,0,-.32],[.92,0,.32]],[[1.58,0,-.32],[1.58,0,.32]]];
  return vox({r:.025,b:[.85,1.65,-.03,.24,-.38,.38],d:(x,y,z)=>Math.min(...S.map(s=>sdCap(x,y,z,s[0],s[1],.024))),c:(x,y,z)=>y<.03?[C.graphite]:[C.steel]});})(),{from:"below",spread:.6});
function engineSD(x,y,z){
  let d=sdBox(x,y,z,1.25,.45,0,.4,.17,.24,.04);
  d=Math.min(d,sdBox(x,y,z,1.25,.24,0,.32,.05,.18,.02),sdBox(x,y,z,1.25,.68,0,.38,.06,.21,.03),sdCap(x,y,z,[.98,.79,0],[1.5,.79,0],.055));
  for(const xi of[1.0,1.17,1.33,1.5])d=Math.min(d,sdCap(x,y,z,[xi,.79,.02],[xi,.72,.15],.022),sdCap(x,y,z,[xi,.6,-.22],[1.2,.36,-.36],.022));
  return Math.min(d,sdBox(x,y,z,1.665,.47,0,.02,.2,.19,.01),sdBox(x,y,z,.83,.45,0,.02,.19,.2,.01));}
part("engine",.02,vox({r:.02,b:[.78,1.74,.15,.92,-.42,.34],d:engineSD,
  c:(x,y,z)=>{if(z<-.24&&y<.62)return[C.copper];if(y>.73&&Math.abs(z)<.07)return[C.metal];if(y>.62&&y<.75)return[(Math.round(x/.06)%2)?C.amber:C.amberLt];
    if(y<.29||x>1.64||x<.86)return[C.dark];if(Math.abs(y-.5)<.012)return[C.amber];return[C.graphite];}}),{spread:1.8});
part("engineB",.02,vox({r:.02,b:[.78,1.74,.15,.92,-.42,.34],d:engineSD,
  c:(x,y,z)=>{if(z<-.24&&y<.62)return[0x6d7a86];if(y>.73&&Math.abs(z)<.07)return[C.metal];if(y>.62&&y<.75)return[(Math.round(x/.06)%2)?0x7a5cd6:0xb48cff];
    if(y<.29||x>1.64||x<.86)return[C.dark];if(Math.abs(y-.5)<.012)return[0xb48cff,1];return[0x2b2f45];}}),{spread:1.6});
function throttleVox(glow){return vox({r:.016,b:[1.12,1.38,.78,1.02,-.13,.13],d:(x,y,z)=>Math.max(Math.abs(Math.hypot(x-1.25,z)-.085)-.016,Math.abs(y-.9)-.08),c:(x,y,z)=>y>.955?[glow,1]:[C.steel]});}
part("throttle",.016,throttleVox(C.blue),{spread:.4});
part("throttleB",.016,throttleVox(0xb48cff),{spread:.4});
function pulleyVox(a1){return vox({r:.016,b:[-.03,.03,-.13,.13,-.13,.13],th:3,d:(x,y,z)=>Math.max(Math.hypot(y,z)-.115,Math.abs(x)-.015),
  c:(x,y,z)=>{const a=Math.atan2(y,z);return Math.hypot(y,z)<.03?[C.metal]:[(Math.floor((a+Math.PI)/(TAU/6))%2)?a1:C.steel];}});}
part("pulley",.016,pulleyVox(C.amber),{pos:[1.715,.45,0],spread:.4});

  for(let i=moving.length-1;i>=0;i--){const b=moving[i],k=Math.min(1,(clock-b.t0)/b.dur);
    if(b.isIn){b.m.position.set(INTAKE.x,INTAKE.y+1.5*(1-k*k),INTAKE.z);b.m.rotation.y=k*1.5;if(k>=1){scene.remove(b.m);moving.splice(i,1);}continue;}
    tv.copy(SHAFT).lerp(b.target,k);tv.y=SHAFT.y+(b.target.y-SHAFT.y)*k*k+Math.sin(k*Math.PI)*.18;b.m.position.copy(tv);b.m.rotation.set(k*4,k*2,0);
    if(k>=1){moving.splice(i,1);addPile(b.m);}}
  for(let i=sweeping.length-1;i>=0;i--){const s=sweeping[i],k=(clock-s.t0)/.5;if(k<0)continue;s.m.scale.setScalar(Math.max(.001,1-k));s.m.position.y-=dt*.1;if(k>=1){scene.remove(s.m);sweeping.splice(i,1);}}
  for(let i=dots.length-1;i>=0;i--){const d=dots[i],k=(clock-d.t0)/(d.dur||1);if(k<0)continue;d.m.visible=true;
    if(d.fall){const f=clock-d.t0;d.m.position.set(1.35+f*.8,.06+Math.max(0,.6*f-2.5*f*f),.82+f*.5);d.m.material.opacity=Math.max(0,1-f*.9);if(f>1.1){eng.remove(d.m);dots.splice(i,1);}continue;}
    if(k>=1){eng.remove(d.m);dots.splice(i,1);continue;}d.cv.getPointAt(k,d.m.position);}
  loopPhase+=dt*(S.perf?.4:.28);loopDots.forEach(d=>CV.loop.getPointAt((loopPhase+d.o)%1,d.m.position));
  loopTube.material.opacity+=((S.loop?.35:0)-loopTube.material.opacity)*Math.min(1,dt*4);loopTube.visible=loopTube.material.opacity>.01;
  if(S.nudge>0){const s=Math.min(S.nudge,dt*1.4);S.nudge-=s;S.roll+=s*.5;}
  S.roll+=S.speed*(REDUCE?0:1.6)*dt;
  WHEELS.forEach(([n])=>{P[n].g.rotation.z=P[n+"R"].g.rotation.z=-S.roll/.34;});
  grid.position.x=-((S.roll%.25)+.25)%.25;
  xr+=(S.xray-xr)*Math.min(1,dt*3);if(REDUCE)xr=S.xray;
  P.body.meshes.forEach(m=>{const kind=m.userData.kind,base=kind===2?.45:1,tr=kind===2||xr>.01;if(m.material.transparent!==tr){m.material.transparent=tr;m.material.needsUpdate=true;}m.material.opacity=base*(1-.8*xr);m.material.depthWrite=kind!==2&&xr<.4;});
  trackOp+=(S.track-trackOp)*Math.min(1,dt*2);if(REDUCE)trackOp=S.track;lineMat.opacity=.75*trackOp;
  laneDashes.forEach(m=>{m.position.x=((m.userData.bx-S.roll)%24+36)%24-12;});
  finishLine.position.x=OFF+3.4-(S.roll-S.finishAt);finishLine.material.opacity=trackOp*(Math.abs(finishLine.position.x)<14?1:0);

}
